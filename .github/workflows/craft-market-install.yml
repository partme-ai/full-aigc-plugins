name: Craft marketplace Git installation
on:
  push:
    paths: ['.github/workflows/craft-market-install.yml', 'scripts/craft-runtime-bootstrap.test.mjs', 'scripts/templates/craft-runtime-bootstrap.mjs', 'scripts/verify-craft-market-install.py', 'scripts/verify-craft-release-zip.py', 'candidate-marketplace/**', 'docs/craft-marketplace-candidate-releases.json']
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app: [cadcraft, designcraft, effectcraft, photocraft, figcraft, filmcraft, lightcraft, printcraft, vectorcraft, deckcraft, soundcraft, gridcraft, wordcraft]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
      - name: Enable Git long paths on this Windows runner
        run: git config --global core.longpaths true
      - name: Install pinned Codex host
        shell: pwsh
        run: |
          npm install --global @openai/codex@0.162.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $root = npm root --global
          "CODEX_CI_JS=$root/@openai/codex/bin/codex.js" >> $env:GITHUB_ENV
      - name: Bootstrap archive and portable MCP regressions
        run: node --test scripts/craft-runtime-bootstrap.test.mjs scripts/portable-mcp-config.test.mjs
      - name: Actual Git install, first download and native MCP calls
        shell: pwsh
        env:
          PYTHONUTF8: '1'
        run: |
          python scripts/verify-craft-market-install.py candidate-marketplace "中文 市场验收" --marketplace-name full-aigc-craft-candidates --app ${{ matrix.app }} --codex-js $env:CODEX_CI_JS
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-market-${{ matrix.app }}
          path: |
            中文 市场验收/*.json
            中文 市场验收/*.log
  linux-all-cold:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
      - name: Install pinned Codex host
        run: npm install --global @openai/codex@0.162.1
      - name: Install all 13 Git candidates and call real native MCP from cold cache
        run: python3 scripts/verify-craft-market-install.py candidate-marketplace cold-acceptance --marketplace-name full-aigc-craft-candidates
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-all-cold
          path: |
            cold-acceptance/*.json
            cold-acceptance/*.log
  windows-release-zip:
    runs-on: windows-2022
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app: [cadcraft, designcraft, effectcraft, photocraft, figcraft, filmcraft, lightcraft, printcraft, vectorcraft, deckcraft, soundcraft, gridcraft, wordcraft]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
      - name: Test complete archives without Git long-path configuration
        run: git config --global core.longpaths false
      - name: Install pinned Codex host
        shell: pwsh
        run: |
          npm install --global @openai/codex@0.162.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $root = npm root --global
          "CODEX_CI_JS=$root/@openai/codex/bin/codex.js" >> $env:GITHUB_ENV
      - name: Download release ZIP, clean extract, native install, discover skills and call MCP
        shell: pwsh
        env:
          PYTHONUTF8: '1'
        run: |
          python scripts/verify-craft-release-zip.py --app ${{ matrix.app }} --codex-js $env:CODEX_CI_JS --output "中文 ZIP 安装"
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-release-zip-${{ matrix.app }}
          path: |
            中文 ZIP 安装/results.json
            中文 ZIP 安装/*/native-host/*.json
            中文 ZIP 安装/*/native-host/*.log
