name: Craft Windows CLI business roundtrip
on:
  push:
    paths: ['scripts/ci/**', '.github/workflows/craft-cli-windows.yml']
  pull_request:
    paths: ['scripts/ci/**', '.github/workflows/craft-cli-windows.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  business:
    runs-on: windows-2022
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        plugin: [cadcraft, designcraft, effectcraft, photocraft, figcraft, filmcraft, lightcraft, printcraft, vectorcraft, deckcraft, soundcraft, gridcraft, wordcraft]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/checkout@v4
        if: matrix.plugin == 'photocraft'
        with:
          repository: full-aigc-skills/photocraft-skills
          ref: 7829f6d3e8882c651a7175e8579d219eca58a938
          path: scene-source
      - uses: actions/checkout@v4
        if: matrix.plugin == 'gridcraft'
        with:
          repository: full-aigc-skills/gridcraft-skills
          ref: be98a0b0356f50f938502880469cc2412d45ff4a
          path: scene-source
      - uses: actions/checkout@v4
        if: matrix.plugin == 'wordcraft'
        with:
          repository: full-aigc-skills/wordcraft-skills
          ref: b81c0401bed68b52cd569000987a1fad7fa84dbd
          path: scene-source
      - uses: actions/checkout@v4
        if: matrix.plugin == 'deckcraft'
        with:
          repository: full-aigc-skills/deckcraft-skills
          ref: 0d0468eeebe81cd7a427ed1da102535498d286c7
          path: scene-source
      - uses: actions/checkout@v4
        if: matrix.plugin == 'soundcraft'
        with:
          repository: full-aigc-skills/soundcraft-skills
          ref: b3fd6f2197533b68098c6ea939d1ee22c98f3650
          path: scene-source
      - uses: actions/checkout@v4
        if: matrix.plugin == 'lightcraft'
        with:
          repository: full-aigc-skills/lightcraft-skills
          ref: 00ef2d690c3a9cf652679e3e910d250b1d476932
          path: scene-source
      - uses: actions/checkout@v4
        if: matrix.plugin == 'cadcraft'
        with:
          repository: full-aigc-skills/cadcraft-skills
          ref: 6da23965128f4f0ba212cc14d6e1422384c14ca7
          path: scene-source
      - name: Run native CLI business operations
        env:
          PYTHONUTF8: '1'
        shell: pwsh
        run: |
          $sceneArgs = @()
          if (@("photocraft", "gridcraft", "wordcraft", "deckcraft", "soundcraft", "lightcraft", "cadcraft") -contains "${{ matrix.plugin }}") { $sceneArgs = @("--playbook", "scene-source/skills/${{ matrix.plugin }}-scenario-playbooks/references/recipes.json") }
          python scripts/ci/craft_cli_windows.py --plugin ${{ matrix.plugin }} --output cli-result @sceneArgs
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-cli-${{ matrix.plugin }}
          if-no-files-found: error
          path: |
            cli-result/result.json
            cli-result/calls.json
            cli-result/commands.json
            cli-result/develop-controls.json
            cli-result/中文 业务 workspace/**
