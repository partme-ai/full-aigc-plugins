name: Craft Windows package and native MCP

on:
  push:
    paths: ['scripts/ci/**', '.github/workflows/craft-windows.yml']
  pull_request:
    paths: ['scripts/ci/**', '.github/workflows/craft-windows.yml']
  workflow_dispatch:
    inputs:
      index_url:
        description: 'HTTPS URL of the complete 13-package index.json (ZIPs alongside it)'
        required: true
        type: string
      index_sha256:
        description: 'SHA-256 of that exact index.json'
        required: true
        type: string

permissions:
  contents: read

jobs:
  packaging-regressions:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Resolve pinned Design scene source
        id: design-source
        shell: pwsh
        run: |
          $revision = python -c "import json; print(next(x['skillsCommit'] for x in json.load(open('scripts/ci/craft_main_candidates.lock.json', encoding='utf-8'))['candidates'] if x['app']=='designcraft'))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "revision=$revision" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@v4
        with:
          repository: full-aigc-skills/designcraft-skills
          ref: ${{ steps.design-source.outputs.revision }}
          path: .local/test-design-skills
      - name: Resolve pinned Print scene source
        id: print-source
        shell: pwsh
        run: |
          $revision = python -c "import json; print(next(x['skillsCommit'] for x in json.load(open('scripts/ci/craft_main_candidates.lock.json', encoding='utf-8'))['candidates'] if x['app']=='printcraft'))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "revision=$revision" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@v4
        with:
          repository: full-aigc-skills/printcraft-skills
          ref: ${{ steps.print-source.outputs.revision }}
          path: .local/test-print-skills
      - run: python -m unittest discover -s scripts/ci -p "test_*.py" -v
        env:
          CRAFT_PRINT_SKILLS_ROOT: ${{ github.workspace }}/.local/test-print-skills/skills
          CRAFT_DESIGN_SKILLS_ROOT: ${{ github.workspace }}/.local/test-design-skills/skills
          PYTHONUTF8: '1'

  native-install:
    if: github.event_name == 'workflow_dispatch' || vars.CRAFT_WINDOWS_INDEX_URL != ''
    needs: packaging-regressions
    runs-on: windows-2022
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        plugin: [cadcraft, designcraft, effectcraft, photocraft, figcraft, filmcraft, lightcraft, printcraft, vectorcraft, deckcraft, soundcraft, gridcraft, wordcraft]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned native Codex CLI
        shell: pwsh
        run: |
          npm install --global @openai/codex@0.162.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $root = npm root --global
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "CODEX_CI_JS=$root/@openai/codex/bin/codex.js" >> $env:GITHUB_ENV
      - name: Install complete package and call native MCP on Windows
        shell: pwsh
        env:
          CRAFT_INDEX_URL: ${{ inputs.index_url || vars.CRAFT_WINDOWS_INDEX_URL }}
          CRAFT_INDEX_SHA256: ${{ inputs.index_sha256 || vars.CRAFT_WINDOWS_INDEX_SHA256 }}
          CRAFT_PLUGIN: ${{ matrix.plugin }}
          PYTHONUTF8: '1'
        run: |
          python scripts/ci/craft_windows.py --require-windows --plugin $env:CRAFT_PLUGIN --index-url $env:CRAFT_INDEX_URL --sha256 $env:CRAFT_INDEX_SHA256 --codex-js $env:CODEX_CI_JS --output "windows-result"
          exit $LASTEXITCODE
      - name: Retain native installer and RPC diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.plugin }}
          if-no-files-found: error
          path: |
            windows-result/result.json
            windows-result/*.log
            windows-result/plugin-install.json
            windows-result/native-rpc.json
