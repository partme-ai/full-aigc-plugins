name: release-gate

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Capture remote immutable release prerequisites
        env:
          GH_TOKEN: ${{ secrets.RELEASE_RULESET_READ_TOKEN || github.token }}
        run: |
          set +e
          python3 scripts/remote_release_preflight.py \
            --output remote-release-preflight.json
          preflight_status=$?
          set -e
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            exit "$preflight_status"
          fi
      - name: Preserve remote preflight evidence even when blocked
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jianying-plugin-remote-preflight
          path: remote-release-preflight.json
          if-no-files-found: error
      - name: Tag must match the plugin version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          version = json.loads(Path('.codex-plugin/plugin.json').read_text())['version'].split('+')[0]
          expected = f'v{version}'
          actual = os.environ['GITHUB_REF_NAME']
          if actual != expected:
              raise SystemExit(f'tag {actual} does not match plugin version {expected}')
          PY
      - name: Complete release readiness report
        run: |
          set +e
          python3 scripts/release_readiness.py --output release-readiness.json
          readiness_status=$?
          set -e
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            exit "$readiness_status"
          fi
      - name: Require native immutable releases for the plugin repository
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.RELEASE_RULESET_READ_TOKEN || github.token }}
        run: |
          enabled="$(gh api "repos/${GITHUB_REPOSITORY}/immutable-releases" --jq .enabled)"
          test "$enabled" = "true"
      - name: Strict distribution release gate
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            python3 scripts/validate_distribution.py --release
          else
            python3 scripts/validate_distribution.py
          fi
      - name: Build and audit the exact plugin source archive
        if: always()
        run: |
          git archive --format=tar.gz \
            --prefix=jianying-draft-plugin/ \
            --output=jianying-draft-plugin-source.tar.gz \
            HEAD
          python3 scripts/validate_plugin_archive.py \
            jianying-draft-plugin-source.tar.gz \
            --source-commit "$GITHUB_SHA" \
            --output plugin-archive-audit.json
      - name: Verify immutable upstream skill ref and vendored digests
        run: python3 scripts/vendor/skill_vendor.py check
      - name: Contract regression tests
        run: |
          python3 -m unittest discover -s tests -t . -v
          node --test tests/*.test.mjs
      - name: Upload release readiness report even when a gate fails
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jianying-plugin-release-readiness
          path: release-readiness.json
          if-no-files-found: ignore
      - name: Preserve plugin archive audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jianying-plugin-release-archive-audit
          path: |
            plugin-archive-audit.json
            jianying-draft-plugin-source.tar.gz
          if-no-files-found: ignore

  fresh-install:
    needs: contract
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: darwin-arm64
          - runner: macos-15-intel
            platform: darwin-x64
          - runner: windows-2025
            platform: win32-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Download, verify, install and handshake without Cargo
        run: >-
          node scripts/release_install_canary.mjs
          --lock runtime/jianying-cli.lock.json
          --install-root "${{ runner.temp }}/jianying-runtime"
          --output "${{ runner.temp }}/release-install-canary-${{ matrix.platform }}.json"
      - name: Preserve platform canary evidence even when it fails
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jianying-plugin-release-canary-${{ matrix.platform }}
          path: ${{ runner.temp }}/release-install-canary-${{ matrix.platform }}.json
          if-no-files-found: error

  evidence:
    if: always()
    needs: [contract, fresh-install]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Create the evidence directory even after upstream failure
        run: mkdir -p release-evidence
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        continue-on-error: true
        with:
          pattern: jianying-plugin-release-*
          path: release-evidence
          merge-multiple: true
      - name: Verify the complete three-platform release evidence
        run: >-
          node scripts/verify_release_evidence.mjs
          --evidence-root release-evidence
          --lock runtime/jianying-cli.lock.json
          --plugin-source-commit "$GITHUB_SHA"
          --output release-evidence/release-evidence-verification.json
      - name: Preserve aggregate verification evidence even when it fails
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jianying-plugin-release-verification
          path: release-evidence/release-evidence-verification.json
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [contract, fresh-install, evidence]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: jianying-plugin-release-*
          path: release-evidence
          merge-multiple: true
      - name: Publish immutable plugin release with gate evidence
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RULESET_READ_TOKEN: ${{ secrets.RELEASE_RULESET_READ_TOKEN || github.token }}
        run: |
          set -euo pipefail
          enabled="$(GH_TOKEN="$RELEASE_RULESET_READ_TOKEN" gh api "repos/${GITHUB_REPOSITORY}/immutable-releases" --jq .enabled)"
          test "$enabled" = "true"
          node scripts/verify_release_evidence.mjs \
            --evidence-root release-evidence \
            --lock runtime/jianying-cli.lock.json \
            --plugin-source-commit "$GITHUB_SHA"
          find release-evidence -type f \( -name '*.json' -o -name '*.tar.gz' \) -print0 \
            > "$RUNNER_TEMP/expected-assets.list"
          release_plan="$RUNNER_TEMP/release-publication-plan.json"
          missing_assets="$RUNNER_TEMP/missing-assets.list"
          python3 scripts/release_publication_plan.py \
            --repository "$GITHUB_REPOSITORY" \
            --expected-paths0 "$RUNNER_TEMP/expected-assets.list" \
            --release-ref "$GITHUB_REF_NAME" \
            --remote origin \
            --expected-commit "$(git rev-parse HEAD)" \
            --output "$release_plan" \
            --missing-paths0 "$missing_assets"
          publication_action="$(jq -r .action "$release_plan")"
          case "$publication_action" in
            create_draft)
              gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --draft
              ;;
            resume_draft)
              echo "resuming a byte-identical partial draft release"
              ;;
            publish_draft)
              echo "draft release already contains the complete byte-identical evidence set"
              ;;
            verify_existing)
              echo "existing immutable release matches this build identity; verifying assets"
              ;;
            *)
              echo "::error::unsupported publication action: $publication_action" >&2
              exit 1
              ;;
          esac
          if [ "$publication_action" = "create_draft" ] \
            || [ "$publication_action" = "resume_draft" ]; then
            xargs -0 gh release upload "$GITHUB_REF_NAME" < "$missing_assets"
          fi
          if [ "$publication_action" != "verify_existing" ]; then
            python3 scripts/release_publication_plan.py \
              --repository "$GITHUB_REPOSITORY" \
              --expected-paths0 "$RUNNER_TEMP/expected-assets.list" \
              --release-ref "$GITHUB_REF_NAME" \
              --remote origin \
              --expected-commit "$(git rev-parse HEAD)" \
              --output "$release_plan" \
              --missing-paths0 "$missing_assets"
            publication_action="$(jq -r .action "$release_plan")"
            test "$publication_action" = "publish_draft"
            gh release edit "$GITHUB_REF_NAME" --draft=false
          fi
          python3 scripts/release_publication_plan.py \
            --repository "$GITHUB_REPOSITORY" \
            --expected-paths0 "$RUNNER_TEMP/expected-assets.list" \
            --release-ref "$GITHUB_REF_NAME" \
            --remote origin \
            --expected-commit "$(git rev-parse HEAD)" \
            --output "$release_plan" \
            --missing-paths0 "$missing_assets"
          test "$(jq -r .action "$release_plan")" = "verify_existing"
          rm -rf "$RUNNER_TEMP/published-release"
          mkdir -p "$RUNNER_TEMP/published-release"
          gh release download "$GITHUB_REF_NAME" \
            --dir "$RUNNER_TEMP/published-release"
          python3 - release-evidence "$RUNNER_TEMP/published-release" <<'PY'
          import hashlib
          import sys
          from pathlib import Path

          def inventory(root):
              result = {}
              for path in Path(root).rglob("*"):
                  if not path.is_file():
                      continue
                  if path.name in result:
                      raise SystemExit(
                          f"published release asset set or digest differs: duplicate {path.name}"
                      )
                  result[path.name] = hashlib.sha256(path.read_bytes()).hexdigest()
              return result

          if inventory(sys.argv[1]) != inventory(sys.argv[2]):
              raise SystemExit("published release asset set or digest differs")
          PY
          verified=false
          release_attestation="$RUNNER_TEMP/release-attestation.json"
          expected_tag_object="$(git ls-remote --tags origin \
            "refs/tags/${GITHUB_REF_NAME}" | cut -f1)"
          for attempt in $(seq 1 30); do
            if ! GH_TOKEN="$RELEASE_RULESET_READ_TOKEN" gh release verify "$GITHUB_REF_NAME" --format json \
              > "$release_attestation"; then
              echo "release attestation not visible yet (attempt ${attempt}/30)"
              sleep 10
              continue
            fi
            if ! python3 scripts/verify_release_attestation.py \
              --input "$release_attestation" \
              --repository "$GITHUB_REPOSITORY" \
              --release-ref "$GITHUB_REF_NAME" \
              --expected-tag-object "$expected_tag_object" \
              --expected-paths0 "$RUNNER_TEMP/expected-assets.list"; then
              echo "release attestation identity is incomplete (attempt ${attempt}/30)"
              sleep 10
              continue
            fi
            all_verified=true
            while IFS= read -r -d '' asset; do
              if ! GH_TOKEN="$RELEASE_RULESET_READ_TOKEN" gh release verify-asset "$GITHUB_REF_NAME" "$asset"; then
                all_verified=false
                break
              fi
            done < "$RUNNER_TEMP/expected-assets.list"
            if [ "$all_verified" = "true" ]; then
              verified=true
              break
            fi
            echo "asset attestation not visible yet (attempt ${attempt}/30)"
            sleep 10
          done
          test "$verified" = "true"
